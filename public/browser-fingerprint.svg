<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a15" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Binary / Code Background -->
  <g fill="#00ff9d" font-family="monospace" font-size="10" opacity="0.1">
    <text x="50" y="50">01001110 01100001 01110110 01101001 01100111 01100001 01110100 01101111</text>
    <text x="60" y="80">01110010 00101110 01110101 01110011 01100101 01110010 01000001 01100111</text>
    <text x="40" y="110">01100101 01101110 01110100 00100000 00111101 00100000 00100010 01001101</text>
    <text x="70" y="140">01101111 01111010 01101001 01101100 01101100 01100001 00101111 01010111</text>
    <text x="50" y="250">01100101 01100010 01000111 01001100 00100000 00111101 00100000 01010100</text>
    <text x="60" y="280">01110010 01110101 01100101 00111011 00100000 01010011 01100011 01110010</text>
    <text x="40" y="310">01100101 01100101 01101110 00101110 01110111 01101001 01100100 01110100</text>
    <text x="70" y="340">01101000 00100000 00111101 00100000 00110001 00111001 00110010 00110000</text>
  </g>

  <!-- Central Fingerprint Abstract -->
  <g transform="translate(400, 200)" fill="none" stroke="#00ff9d" stroke-width="2" stroke-linecap="round" filter="url(#glowGreen)">
    <path d="M 0 -80 C 40 -80, 60 -40, 60 0 C 60 40, 30 60, 0 80" stroke-opacity="0.9"/>
    <path d="M -20 -60 C 20 -70, 40 -30, 40 0 C 40 30, 10 50, -10 60" stroke-opacity="0.8"/>
    <path d="M -40 -40 C -10 -50, 20 -10, 20 10 C 20 40, 0 40, -30 30" stroke-opacity="0.7"/>
    <path d="M -60 -20 C -40 -30, -10 0, 0 20" stroke-opacity="0.6"/>
    <path d="M -60 10 C -40 0, -20 20, -10 30" stroke-opacity="0.5"/>
    <path d="M 10 -40 C 30 -50, 50 -20, 50 10 C 50 30, 20 40, 10 50" stroke-dasharray="4 4" stroke-opacity="0.9"/>
    
    <!-- Central Node -->
    <circle cx="0" cy="0" r="10" fill="#00ff9d" stroke="none" />
  </g>

  <!-- Connecting Lines -->
  <g stroke="#00ff9d" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <path d="M 400 200 L 250 100" />
    <path d="M 400 200 L 250 300" />
    <path d="M 400 200 L 550 100" />
    <path d="M 400 200 L 550 300" />
    <path d="M 400 200 L 650 200" />
    <path d="M 400 200 L 150 200" />
  </g>

  <!-- Node Circles -->
  <g fill="#050a15" stroke="#00ff9d" stroke-width="2" filter="url(#glowGreen)">
    <circle cx="250" cy="100" r="20" />
    <circle cx="250" cy="300" r="20" />
    <circle cx="550" cy="100" r="20" />
    <circle cx="550" cy="300" r="20" />
    <circle cx="650" cy="200" r="20" />
    <circle cx="150" cy="200" r="20" />
  </g>

  <!-- Node Labels -->
  <g fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="250" y="80">User-Agent</text>
    <text x="150" y="170">Screen Res</text>
    <text x="250" y="340">Installed Fonts</text>
    <text x="550" y="80">Hardware Concurrency</text>
    <text x="650" y="170">WebGL Render</text>
    <text x="550" y="340">Timezone / Locales</text>
  </g>
</svg>
