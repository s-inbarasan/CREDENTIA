<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 50 H 800 M 0 100 H 800 M 0 150 H 800 M 0 200 H 800 M 0 250 H 800 M 0 300 H 800 M 0 350 H 800" />
    <path d="M 100 0 V 400 M 200 0 V 400 M 300 0 V 400 M 400 0 V 400 M 500 0 V 400 M 600 0 V 400 M 700 0 V 400" />
  </g>

  <!-- Central Asset (The "Castle") -->
  <g transform="translate(400, 200)">
    <!-- Perimeter Defenses -->
    <circle cx="0" cy="0" r="140" fill="url(#shieldGrad)" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="#001122" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Database Icon -->
    <path d="M -20 -15 C -20 -25, 20 -25, 20 -15 V 15 C 20 25, -20 25, -20 15 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M -20 -15 C -20 -5, 20 -5, 20 -15" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M -20 0 C -20 10, 20 10, 20 0" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Attack Vectors (Red Arrows) -->
  <g stroke="#ff0044" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Phishing (Vendor) -->
    <path d="M 100 80 Q 250 80 300 120 T 360 160" />
    <polygon points="360,160 350,150 345,165" fill="#ff0044" stroke="none" transform="rotate(-30 360 160)"/>
    
    <!-- Brute Force -->
    <path d="M 100 320 Q 250 320 300 280 T 360 240" />
    <polygon points="360,240 350,230 345,245" fill="#ff0044" stroke="none" transform="rotate(30 360 240)"/>
    
    <!-- Supply Chain -->
    <path d="M 700 80 Q 550 80 500 120 T 440 160" />
    <polygon points="440,160 450,150 455,165" fill="#ff0044" stroke="none" transform="rotate(-150 440 160)"/>

    <!-- API Vulnerability -->
    <path d="M 700 320 Q 550 320 500 280 T 440 240" />
    <polygon points="440,240 450,230 455,245" fill="#ff0044" stroke="none" transform="rotate(150 440 240)"/>
  </g>

  <!-- Labels -->
  <g fill="#ffffff" font-family="monospace" font-size="12" opacity="0.8">
    <text x="80" y="70">Phishing / HVAC Vendor</text>
    <text x="80" y="340">Credential Stuffing</text>
    <text x="600" y="70">Supply Chain Exploit</text>
    <text x="600" y="340">Stolen API Keys</text>
    <text x="360" y="275" fill="#00f0ff">Attack Surface</text>
    <text x="365" y="205" font-weight="bold">Target</text>
  </g>
</svg>
