<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020510" />
      <stop offset="100%" stop-color="#1a0005" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Breach Database (Left) -->
  <g transform="translate(100, 200)">
    <path d="M -40 -30 C -40 -50, 40 -50, 40 -30 V 30 C 40 50, -40 50, -40 30 Z" fill="none" stroke="#ff0044" stroke-width="3" filter="url(#glowRed)"/>
    <path d="M -40 -10 C -40 10, 40 10, 40 -10" fill="none" stroke="#ff0044" stroke-width="3" filter="url(#glowRed)"/>
    <path d="M -40 10 C -40 30, 40 30, 40 10" fill="none" stroke="#ff0044" stroke-width="3" filter="url(#glowRed)"/>
    <text x="0" y="70" fill="#ff0044" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Breached Combolists</text>
  </g>

  <!-- Botnet Array (Center) -->
  <g transform="translate(400, 200)" filter="url(#glowBlue)">
    <!-- Bot 1 -->
    <rect x="-80" y="-120" width="40" height="40" rx="5" fill="#001122" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="-60" cy="-100" r="5" fill="#00f0ff"/>
    <!-- Bot 2 -->
    <rect x="-80" y="-20" width="40" height="40" rx="5" fill="#001122" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="-60" cy="0" r="5" fill="#00f0ff"/>
    <!-- Bot 3 -->
    <rect x="-80" y="80" width="40" height="40" rx="5" fill="#001122" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="-60" cy="100" r="5" fill="#00f0ff"/>
    
    <text x="-60" y="-140" fill="#00f0ff" font-family="monospace" font-size="10" text-anchor="middle">Headless Proxy</text>
    <text x="-60" y="-40" fill="#00f0ff" font-family="monospace" font-size="10" text-anchor="middle">Headless Proxy</text>
    <text x="-60" y="140" fill="#00f0ff" font-family="monospace" font-size="10" text-anchor="middle">Headless Proxy</text>
  </g>

  <!-- Data Flow Lines (Left to Bots) -->
  <g stroke="#ff0044" stroke-width="2" stroke-dasharray="8 4" fill="none" opacity="0.8">
    <path d="M 150 200 C 200 200, 250 -100, 320 -100" />
    <path d="M 150 200 C 200 200, 250 0, 320 0" />
    <path d="M 150 200 C 200 200, 250 100, 320 100" />
  </g>

  <!-- Target Infrastructure (Right) -->
  <g transform="translate(680, 200)">
    <!-- Target 1 -->
    <rect x="-30" y="-115" width="60" height="30" rx="3" fill="#111" stroke="#ffffff" stroke-width="1"/>
    <!-- Target 2 -->
    <rect x="-30" y="-15" width="60" height="30" rx="3" fill="#111" stroke="#ffffff" stroke-width="1"/>
    <!-- Target 3 -->
    <rect x="-30" y="85" width="60" height="30" rx="3" fill="#111" stroke="#ffffff" stroke-width="1"/>
    
    <text x="0" y="-130" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" opacity="0.8">Login API</text>
  </g>

  <!-- Data Flow Lines (Bots to Target) -->
  <g stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 5" fill="none" opacity="0.8">
    <path d="M 360 -100 L 650 -100" />
    <path d="M 360 0 L 650 0" />
    <path d="M 360 100 L 650 100" />
    <!-- Distributing Attacks -->
    <path d="M 360 -100 L 650 0" stroke-opacity="0.3"/>
    <path d="M 360 0 L 650 -100" stroke-opacity="0.3"/>
    <path d="M 360 100 L 650 0" stroke-opacity="0.3"/>
    <path d="M 360 0 L 650 100" stroke-opacity="0.3"/>
  </g>

</svg>
